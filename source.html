<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Occultus</title>

    <!--
        Local resources are served through the Worker, so the browser
        never reads the project folder directly.
    -->
    <link rel="stylesheet" href="assets/app.css">
</head>

<body>

    <img class="logo" src="assets/logo.svg" alt="Occultus">

    <h1>Occultus</h1>

    <p id="counter">Count: 0</p>

    <p id="message">Waiting...</p>

    <button id="increment">
        Increment
    </button>

    <button id="change">
        Change message
    </button>

    <button id="reset">
        Reset
    </button>


    <!--
        EVERYTHING IN THIS SCRIPT IS SECRET.

        It exists in source.html.

        The Worker extracts it and does not send it
        to the browser.
    -->

    <script>

        let count = 0;


        document
            .getElementById("increment")
            .addEventListener("click", () => {

                count++;

                document
                    .getElementById("counter")
                    .textContent =
                        `Count: ${count}`;

                document
                    .getElementById("message")
                    .textContent =
                        `Clicked ${count} times.`;
            });


        document
            .getElementById("change")
            .addEventListener("click", () => {

                document
                    .getElementById("message")
                    .textContent =
                        "This was changed by secret JS.";
            });

    </script>


    <!--
        External application script. The Worker fetches it through the
        assets binding and runs it server-side; the browser never sees it.
    -->
    <script src="assets/app.js"></script>

</body>
</html>
