<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Frontend Demo</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 60px auto;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Secret Frontend</h1>

    <p id="counter">Count: 0</p>

    <button id="increment">
        Increment
    </button>

    <button id="change">
        Change message
    </button>

    <p id="status">
        Waiting...
    </p>


    <!--
        THIS IS THE CODE THAT SHOULD EVENTUALLY BE SECRET.
    -->

    <script>

        let count = 0;

        document
            .getElementById("increment")
            .addEventListener("click", () => {

                count++;

                document.getElementById("counter")
                    .textContent = "Count: " + count;

                document.getElementById("status")
                    .textContent = "You clicked it " + count + " times.";

            });


        document
            .getElementById("change")
            .addEventListener("click", () => {

                document.getElementById("status")
                    .textContent = "The secret frontend JS ran!";

            });

    </script>

</body>
</html>
