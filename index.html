<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret Frontend</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
        }

        button {
            padding: 10px 16px;
            margin-right: 8px;
            cursor: pointer;
        }

        #counter {
            font-size: 2rem;
        }
    </style>
</head>

<body>

    <h1>Secret Frontend</h1>

    <p id="counter">Count: 0</p>

    <p id="message">Waiting...</p>

    <button id="increment">
        Increment
    </button>

    <button id="change">
        Change message
    </button>

    <!--
        This JavaScript is NEVER sent to the browser.

        The Worker removes this entire <script> element
        before returning the page.
    -->

    <script>

        let count = 0;

        document
            .getElementById("increment")
            .addEventListener("click", () => {

                count++;

                document
                    .getElementById("counter")
                    .textContent = `Count: ${count}`;

                document
                    .getElementById("message")
                    .textContent =
                        `Clicked ${count} times.`;

            });


        document
            .getElementById("change")
            .addEventListener("click", () => {

                document
                    .getElementById("message")
                    .textContent =
                        "This was changed by the application JavaScript.";

            });

    </script>

</body>
</html>
