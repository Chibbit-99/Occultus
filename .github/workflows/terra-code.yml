# Made by scTerra: Terra Code works here when someone who can push comments @terra on an issue
# or pull request or when started from the Actions tab.
# Change it from Terra Code's settings in scTerra, or delete this file to stop it.
name: Terra Code
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: What Terra Code should do
        required: true
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
concurrency:
  group: terra-code-${{ github.event.issue.number || github.run_id }}
jobs:
  terra-code:
    # Only people who can already push may spend the key on a comment.
    if: github.event_name != 'issue_comment' || (contains(github.event.comment.body, '@terra') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get Terra Code
        run: curl -fsSL -o "$RUNNER_TEMP/runner.mjs" https://github.com/sc-simpledev/scTerra/releases/latest/download/terra-code-runner.mjs
      - name: Terra Code works on it
        env:
          SCTERRA_AI_KEY: ${{ secrets.SCTERRA_AI_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SCTERRA_MODEL: ${{ vars.SCTERRA_MODEL }}
          SCTERRA_SCHEDULES: '[]'
        run: node "$RUNNER_TEMP/runner.mjs" --event
