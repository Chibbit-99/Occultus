name = "occultus"

main = "worker.js"

compatibility_date = "2026-09-25"

[assets]
directory = "."
binding = "ASSETS"

# The Worker is the only entry point: it decides what reaches the browser
# (the page, the injected runtime and the resources it proxies). Everything
# else — source.html, application scripts, tests — stays private.
run_worker_first = true
